---
name: Build Developer Images Locally

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-developer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            build_args: |
              WINE_FLAVOR=stable
              ENABLE_WINETRICKS=false
              INSTALL_DEBUG_TOOLS=false
              DEFAULT_WINEDEBUG=-all
            channel_tag: dev
          - channel: staging
            build_args: |
              WINE_FLAVOR=staging
              ENABLE_WINETRICKS=true
              WINETRICKS_PACKAGES=win10 vcrun2022
              INSTALL_DEBUG_TOOLS=false
              DEFAULT_WINEDEBUG=-all
            channel_tag: dev-staging
          - channel: debug
            build_args: |
              WINE_FLAVOR=stable
              ENABLE_WINETRICKS=false
              INSTALL_DEBUG_TOOLS=true
              DEFAULT_WINEDEBUG=warn+timestamp
            channel_tag: dev-debug

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image without publishing
        run: |
          set -euo pipefail
          build_args=()
          while IFS= read -r arg; do
            [[ -n "$arg" ]] && build_args+=(--build-arg "$arg")
          done <<< '${{ matrix.build_args }}'
          podman build \
            --pull=missing \
            --platform linux/amd64 \
            --tag "localhost/windrose-ds:${{ matrix.channel_tag }}" \
            "${build_args[@]}" \
            .