name: Validate Release Image Locally

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build release image without publishing
        run: |
          set -euo pipefail
          podman build \
            --pull=missing \
            --platform linux/amd64 \
            --tag "localhost/windrose-ds:${GITHUB_REF_NAME}" \
            --build-arg WINE_FLAVOR=stable \
            --build-arg ENABLE_WINETRICKS=false \
            --build-arg INSTALL_DEBUG_TOOLS=false \
            --build-arg DEFAULT_WINEDEBUG=-all \
            .
